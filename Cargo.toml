[workspace]
resolver = "2"
members = ["leetcode", "codeforces"]

# The solutions are kept verbatim, so silence style lints they would trigger.
[workspace.lints.rust]
dead_code = "allow"
non_snake_case = "allow"
unused_assignments = "allow"
unused_mut = "allow"
unused_parens = "allow"
unused_variables = "allow"
